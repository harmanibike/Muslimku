
name: muslimku
description: Aplikasi ibadah Muslimku - jadwal salat, Al-Qur'an, kiblat, tasbih, doa dan hadis.
publish_to: 'none'
version: 1.3.3+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/
