name: Build Muslimku APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The supplied source archive does not include Gradle Wrapper files.
      # Generate any missing Android platform scaffolding before building.
      - name: Complete Android platform scaffolding
        run: flutter create --platforms=android --project-name muslimku .

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muslimku-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
